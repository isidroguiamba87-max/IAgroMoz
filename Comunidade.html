    <script>
        // Simulação de API e Base de Dados
        class ForumAPI {
            constructor() {
                this.posts = this.carregarPostsIniciais();
                this.comentarios = this.carregarComentariosIniciais();
                this.usuarios = this.carregarUsuarios();
                this.nextPostId = this.posts.length + 1;
                this.nextCommentId = this.comentarios.length + 1;
            }

            // CRUD para Posts
            async criarPost(dadosPost) {
                const novoPost = {
                    id: this.nextPostId++,
                    titulo: dadosPost.titulo,
                    categoria: dadosPost.categoria,
                    descricao: dadosPost.descricao,
                    autor: dadosPost.autor || 'Usuário Atual',
                    autorId: dadosPost.autorId || 1,
                    dataPublicacao: new Date().toISOString(),
                    status: 'aberto',
                    votos: 0,
                    visualizacoes: 0,
                    urgente: dadosPost.urgente || false,
                    tags: dadosPost.tags || []
                };
                
                this.posts.unshift(novoPost);
                this.salvarDados();
                return novoPost;
            }

            async obterPosts(filtros = {}, pagina = 1, limite = 10) {
                let postsFiltrados = [...this.posts];
                
                // Aplicar filtros
                if (filtros.categoria) {
                    postsFiltrados = postsFiltrados.filter(post => post.categoria === filtros.categoria);
                }
                
                if (filtros.status) {
                    postsFiltrados = postsFiltrados.filter(post => post.status === filtros.status);
                }
                
                if (filtros.pesquisa) {
                    const termo = filtros.pesquisa.toLowerCase();
                    postsFiltrados = postsFiltrados.filter(post => 
                        post.titulo.toLowerCase().includes(termo) ||
                        post.descricao.toLowerCase().includes(termo)
                    );
                }
                
                // Ordenação
                switch (filtros.ordenacao) {
                    case 'popular':
                        postsFiltrados.sort((a, b) => b.visualizacoes - a.visualizacoes);
                        break;
                    case 'comentarios':
                        postsFiltrados.sort((a, b) => this.contarComentarios(b.id) - this.contarComentarios(a.id));
                        break;
                    case 'votos':
                        postsFiltrados.sort((a, b) => b.votos - a.votos);
                        break;
                    default: // recente
                        postsFiltrados.sort((a, b) => new Date(b.dataPublicacao) - new Date(a.dataPublicacao));
                }
                
                // Paginação
                const inicio = (pagina - 1) * limite;
                const fim = inicio + limite;
                const postsPage = postsFiltrados.slice(inicio, fim);
                
                return {
                    posts: postsPage,
                    total: postsFiltrados.length,
                    pagina,
                    totalPaginas: Math.ceil(postsFiltrados.length / limite)
                };
            }

            async obterPost(id) {
                const post = this.posts.find(p => p.id === id);
                if (post) {
                    post.visualizacoes++;
                    this.salvarDados();
                }
                return post;
            }

            async atualizarPost(id, dadosAtualizacao) {
                const index = this.posts.findIndex(p => p.id === id);
                if (index !== -1) {
                    this.posts[index] = { ...this.posts[index], ...dadosAtualizacao };
                    this.salvarDados();
                    return this.posts[index];
                }
                return null;
            }

            async excluirPost(id) {
                const index = this.posts.findIndex(p => p.id === id);
                if (index !== -1) {
                    this.posts.splice(index, 1);
                    // Remover comentários relacionados
                    this.comentarios = this.comentarios.filter(c => c.postId !== id);
                    this.salvarDados();
                    return true;
                }
                return false;
            }

            async votarPost(id, tipo) {
                const post = this.posts.find(p => p.id === id);
                if (post) {
                    if (tipo === 'up') {
                        post.votos++;
                    } else if (tipo === 'down' && post.votos > 0) {
                        post.votos--;
                    }
                    this.salvarDados();
                    return post.votos;
                }
                return null;
            }

            // CRUD para Comentários
            async criarComentario(dadosComentario) {
                const novoComentario = {
                    id: this.nextCommentId++,
                    postId: dadosComentario.postId,
                    autor: dadosComentario.autor || 'Usuário Atual',
                    autorId: dadosComentario.autorId || 1,
                    conteudo: dadosComentario.conteudo,
                    dataPublicacao: new Date().toISOString(),
                    votos: 0,
                    parentId: dadosComentario.parentId || null
                };
                
                this.comentarios.push(novoComentario);
                this.salvarDados();
                return novoComentario;
            }

            async obterComentarios(postId) {
                return this.comentarios
                    .filter(c => c.postId === postId)
                    .sort((a, b) => new Date(a.dataPublicacao) - new Date(b.dataPublicacao));
            }

            async votarComentario(id, tipo) {
                const comentario = this.comentarios.find(c => c.id === id);
                if (comentario) {
                    if (tipo === 'up') {
                        comentario.votos++;
                    } else if (tipo === 'down' && comentario.votos > 0) {
                        comentario.votos--;
                    }
                    this.salvarDados();
                    return comentario.votos;
                }
                return null;
            }

            // Métodos auxiliares
            contarComentarios(postId) {
                return this.comentarios.filter(c => c.postId === postId).length;
            }

            obterEstatisticas() {
                const hoje = new Date().toDateString();
                const postsHoje = this.posts.filter(p => 
                    new Date(p.dataPublicacao).toDateString() === hoje
                ).length;
                
                const resolvidos = this.posts.filter(p => p.status === 'resolvido').length;
                const percentualResolvidos = Math.round((resolvidos / this.posts.length) * 100);
                
                return {
                    totalPosts: this.posts.length,
                    usuariosAtivos: this.usuarios.length,
                    postsHoje,
                    percentualResolvidos
                };
            }

            salvarDados() {
                localStorage.setItem('forum_posts', JSON.stringify(this.posts));
                localStorage.setItem('forum_comentarios', JSON.stringify(this.comentarios));
            }

            carregarPostsIniciais() {
                const savedPosts = localStorage.getItem('forum_posts');
                if (savedPosts) {
                    return JSON.parse(savedPosts);
                }
                
                return [
                    {
                        id: 1,
                        titulo: "Como controlar a lagarta-do-cartucho no milho?",
                        categoria: "pragas",
                        descricao: "Estou enfrentando problemas com lagarta-do-cartucho na minha plantação de milho. Já tentei alguns defensivos mas não está funcionando. Alguém tem experiência com controle biológico?",
                        autor: "João Machava",
                        autorId: 2,
                        dataPublicacao: "2025-01-15T10:30:00Z",
                        status: "aberto",
                        votos: 12,
                        visualizacoes: 45,
                        urgente: true,
                        tags: ["milho", "pragas", "controle-biologico"]
                    },
                    {
                        id: 2,

                        descricao: "Pessoal de Nampula, qual a melhor época para plantar mandioca na nossa região? Estou pensando em começar em março, mas não tenho certeza se é o ideal.",
                        autor: "Maria Santos",
                        autorId: 3,
                        dataPublicacao: "2025-01-14T15:20:00Z",
                        status: "discussao",
                        votos: 8,
                        visualizacoes: 32,
                        urgente: false,
                        tags: ["mandioca", "nampula", "epoca-plantio"]
                    },
                    {

                        categoria: "mercado",
                        descricao: "Alguém tem informações sobre os preços atuais do amendoim para exportação? Estou planejando aumentar a produção e gostaria de saber se vale a pena.",
                        autor: "Carlos Mabunda",
                        autorId: 4,
                        dataPublicacao: "2025-01-14T09:15:00Z",
                        status: "aberto",
                        votos: 15,
                        visualizacoes: 67,
                        urgente: false,
                        tags: ["amendoim", "exportacao", "precos"]
                    },
                    {
                        id: 4,
                        titulo: "Sistema de irrigação por gotejamento caseiro",
                        categoria: "irrigacao",
                        descricao: "Compartilho aqui um sistema de irrigação por gotejamento que montei com materiais locais. Gastei apenas 2.000 MT e está funcionando muito bem na minha horta de tomate.",
                        autor: "Ana Sitoe",
                        autorId: 5,
                        dataPublicacao: "2025-01-13T14:45:00Z",

                        votos: 23,

            }

            carregarComentariosIniciais() {
                const savedComments = localStorage.getItem('forum_comentarios');
                if (savedComments) {
                    return JSON.parse(savedComments);
                }
                
                return [
                    {
                        id: 1,
                        postId: 1,

        function renderizarPaginacao(resultado) {
            const paginacao = document.getElementById('paginacao');
            const numerosPagina = document.getElementById('numerosPagina');
            const paginaAnterior = document.getElementById('paginaAnterior');
            const proximaPagina = document.getElementById('proximaPagina');
            
            // Limpar números de página
            numerosPagina.innerHTML = '';
            
            // Botão anterior
            paginaAnterior.disabled = resultado.pagina === 1;
            paginaAnterior.onclick = () => {
                if (resultado.pagina > 1) {
                    paginaAtual = resultado.pagina - 1;
                    carregarPostagens();
                }
            };
            
            // Números de página
            for (let i = 1; i <= resultado.totalPaginas; i++) {
                const btn = document.createElement('button');
                btn.className = `px-3 py-2 rounded-lg transition ${
                    i === resultado.pagina 
                        ? 'bg-green-500 text-white' 
                        : 'bg-white border border-gray-300 hover:bg-gray-50'
                }`;
                btn.textContent = i;
                btn.onclick = () => {
                    paginaAtual = i;
                    carregarPostagens();
                };
                numerosPagina.appendChild(btn);
            }
            
            // Botão próxima
            proximaPagina.disabled = resultado.pagina === resultado.totalPaginas;
            proximaPagina.onclick = () => {
                if (resultado.pagina < resultado.totalPaginas) {
                    paginaAtual = resultado.pagina + 1;
                    carregarPostagens();
                }
            };
        }
