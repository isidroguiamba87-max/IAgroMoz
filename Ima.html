<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emails Recebidos - IAGROMOZ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        .glass-effect {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 1.5rem;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .fade-in {
            opacity: 0;
            transform: translateY(40px);
            animation: fadeInUp 1s ease-out forwards;
        }
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .gradient-text {
            background: linear-gradient(135deg, #16a34a, #22c55e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo-animate {
            animation: floatLogo 3s ease-in-out infinite;
        }
        @keyframes floatLogo {
            0%, 100% { transform: translateY(0);}
            50% { transform: translateY(-15px);}
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-green-600 via-green-400 to-emerald-300">
    <div class="max-w-xl w-full mx-auto p-8 glass-effect shadow-2xl fade-in">
        <div class="flex justify-center mb-4">
            <img src="kki/log.img.png" alt="Logo" class="w-20 h-20 rounded-full logo-animate shadow-lg border-4 border-white border-opacity-30">
        </div>
        <h1 class="text-3xl font-bold gradient-text mb-6 text-center">Emails Recebidos</h1>
        <div id="email-list" class="space-y-4">
            <!-- Email addresses will be displayed here -->
        </div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
