<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IAgroMoz - Monitorização Satélite</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet Draw -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>

  <style>
    #map {
      height: 70vh;
      border-radius: 12px;
    }
  </style>
</head>

<body class="bg-gray-100">
  <!-- HEADER -->
  <header class="p-4 bg-green-600 text-white shadow-lg flex items-center justify-between">
    <h1 class="text-xl font-bold">IAgroMoz — Monitorização por Satélite</h1>
    <a href="index.html" class="bg-white text-green-600 px-3 py-2 rounded-xl shadow">Voltar</a>
  </header>

  <!-- PAGE CONTENT -->
  <main class="max-w-6xl mx-auto p-6">

    <h2 class="text-2xl font-bold text-gray-900 mb-2">Mapa da Machamba</h2>
    <p class="text-gray-700 mb-4">Use o GPS para localizar a sua área e desenhe o contorno da sua machamba.</p>

    <div class="flex gap-4 mb-4">
      <button id="btnLocate" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-xl shadow">
        📍 Detectar Localização
      </button>
      
      <button id="btnSave" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl shadow">
        💾 Salvar Área
      </button>
    </div>

    <!-- MAPA -->
    <div id="map" class="shadow-lg"></div>

    <h3 class="text-lg font-bold mt-6">GeoJSON capturado</h3>
    <pre id="output" class="bg-white rounded-xl p-4 mt-2 shadow text-sm max-h-64 overflow-y-auto"></pre>

  </main>

<script>
let map;
let drawnItems;
let lastPolygon = null;

// Inicializa o mapa
function initMap(lat = -25.95, lon = 32.58) {
  map = L.map('map').setView([lat, lon], 16);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19
  }).addTo(map);

  drawnItems = new L.FeatureGroup();
  map.addLayer(drawnItems);

  const drawControl = new L.Control.Draw({
    edit: { featureGroup: drawnItems },
    draw: {
      circle: false,
      polyline: false,
      marker: false,
      circlemarker: false
    }
  });

  map.addControl(drawControl);

  map.on('draw:created', function (e) {
    drawnItems.clearLayers();
    drawnItems.addLayer(e.layer);

    lastPolygon = e.layer.toGeoJSON();
    document.getElementById('output').textContent = JSON.stringify(lastPolygon, null, 2);
  });
}

initMap();

// Botão GPS
const locateBtn = document.getElementById('btnLocate');
locateBtn.onclick = () => {
  if (!navigator.geolocation) {
    alert('Este dispositivo não suporta geolocalização.');
    return;
  }

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;

      map.setView([lat, lon], 17);

      L.marker([lat, lon]).addTo(map)
        .bindPopup('Você está aqui').openPopup();
    },
    () => alert('Erro ao obter localização.')
  );
};

// Botão salvar
const saveBtn = document.getElementById('btnSave');
saveBtn.onclick = () => {
  if (!lastPolygon) {
    alert('Desenhe a sua machamba primeiro.');
    return;
  }

  const data = {
    boundary_geojson: lastPolygon.geometry
  };

  alert('Área capturada! Integração Django pronta para ativar.');

  /*
  fetch('/api/satellite/fields/create/', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ farm: 1, name: 'Machamba', boundary_geojson: lastPolygon.geometry })
  })
    .then(r => r.json())
    .then(r => alert('Área salva com sucesso!'));
  */
};
</script>

</body>
</html>
